[project]
name = "keepassbox"
version = "0.2.1"
description = "REST and MCP access to KeePass databases"
requires-python = ">=3.12"
dependencies = [
  "construct==2.10.70",
  "fastapi==0.136.1",
  "fastmcp==4.2.0",
  "pykeepass==4.2.0",
  "pyotp==2.10.0",
  "uvicorn==0.46.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.3", "ruff==0.15.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
exclude-newer = "2026-11-15T00:52:39Z"
